services:
  nessie-catalog:
    image: projectnessie/nessie:0.76.6
    container_name: nessie-catalog
    ports:
      - "19120:19120"
    networks:
      lakehouse-net:
        aliases:
          - nessie
          - nessie-catalog

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_REGION_NAME: us-east-1
      MINIO_REGION: us-east-1
      MINIO_DOMAIN: minio
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    entrypoint: >
      /bin/sh -c "
      minio server /data --console-address ':9001' &
      sleep 5;
      mc alias set batman http://localhost:9000 admin password;
      mc mb batman/local-lakehouse;
      tail -f /dev/null"
    networks:
      lakehouse-net:
        aliases:
          - minio
          - s3


  polaris:
    image: apache/polaris:1.3.0-incubating   # <-- замените на реальный образ/тег Polaris, который вы используете
    container_name: polaris
    ports:
      - "${POLARIS_PORT:-8181}:8181"
      - "${POLARIS_MGMT_PORT:-8182}:8182"
    environment:
      POLARIS_DB_URL: "jdbc:postgresql://postgres:5432/${POLARIS_DB}"
      POLARIS_DB_USER: "${POLARIS_DB_USER}"
      POLARIS_DB_PASSWORD: "${POLARIS_DB_PASS}"

      POLARIS_BOOTSTRAP_CREDENTIALS: "${POLARIS_BOOTSTRAP_CREDENTIALS}"

      POLARIS_S3_ENDPOINT: "http://minio:9000"
      POLARIS_S3_ACCESS_KEY: "admin"
      POLARIS_S3_SECRET_KEY: "password"
      POLARIS_S3_REGION: "us-east-1"
      POLARIS_WAREHOUSE: "s3://local-lakehouse/"
    networks:
      lakehouse-net:
        aliases: [ polaris ]
    depends_on:
      - minio


  polaris-init:
    image: alpine:3.20
    container_name: polaris-init
    depends_on:
      - polaris
    command:
      - sh
      - -lc
      - |
        set -e
        apk add --no-cache curl jq bash
        /init/init.sh
    environment:
      - POLARIS_CATALOG_BASE=http://polaris:8181
      - POLARIS_MGMT_BASE=http://polaris:8181

      - POLARIS_CLIENT_ID=${POLARIS_CLIENT_ID}
      - POLARIS_CLIENT_SECRET=${POLARIS_CLIENT_SECRET}
      - POLARIS_SCOPE=${POLARIS_SCOPE}

      - POLARIS_WAREHOUSE_NAME=${POLARIS_WAREHOUSE_NAME}
      - POLARIS_ALLOWED_LOCATION=${POLARIS_ALLOWED_LOCATION}
      - POLARIS_DEFAULT_BASE_LOCATION=${POLARIS_DEFAULT_BASE_LOCATION}
    volumes:
      - ./polaris:/init:ro
    networks:
      - lakehouse-net
    restart: "no"


networks:
  lakehouse-net:
    external: true
