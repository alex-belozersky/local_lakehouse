connector.name=iceberg

iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=${ENV:POLARIS_WAREHOUSE_NAME}

iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.token-endpoint=http://polaris:8181/api/catalog/v1/oauth/tokens
iceberg.rest-catalog.oauth2.client-id=${ENV:POLARIS_CLIENT_ID}
iceberg.rest-catalog.oauth2.client-secret=${ENV:POLARIS_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=${ENV:POLARIS_SCOPE}

# S3/MinIO
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=admin
s3.aws-secret-key=password