services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      # нужно для /docker-entrypoint-initdb.d/01-initdb.sh
      AIRFLOW_DB: ${AIRFLOW_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASS: ${AIRFLOW_DB_PASS}

      POLARIS_DB: ${POLARIS_DB}
      POLARIS_DB_USER: ${POLARIS_DB_USER}
      POLARIS_DB_PASS: ${POLARIS_DB_PASS}

      TRINO_DB: ${TRINO_DB}
      TRINO_DB_USER: ${TRINO_DB_USER}
      TRINO_DB_PASS: ${TRINO_DB_PASS}

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./postgres_config/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      lakehouse-net:
        aliases:
          - postgres
          - db   # опционально

volumes:
  postgres-db-volume:


networks:
  lakehouse-net:
    external: true

